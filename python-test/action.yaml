# NOTE: Keep documentation in sync with docs/python-test.md.

name: Test Python code.
description: >-
  :::{admonition} Guidance

  Developers **MUST** run this action in a dedicated, unprivileged
  workflow job to limit the risk of a supply chain attack.

  :::

  Run tests via GNU Make.  This action installs Python along with
  matching versions of Google Chrome and ChromeDriver for use with
  Selenium.  The makefile targets `build-deps` (which runs as the
  superuser) and `test` handle other test dependencies.

inputs:
  python-version:
    required: true
    default: "3.13"
    description: >-
      Specify the version of Python with which to run pytest.
  requirements:
    deprecationMessage: >-
      This input will be removed after 2026-12-31.  The action now
      downloads all available workflow artifacts by default.  Use the
      `skip-artifact-downloads` input to change this behavior.
  skip-artifact-downloads:
    description: >-
      Set this to `true` when managing the contents of the runner's
      working directory outside of this action.

runs:
  using: composite
  steps:
    - if: ${{ !inputs.python-version }}
      name: Validate inputs.
      shell: bash
      run: |
        echo The python-version input is REQUIRED.
        exit 1
    - name: Clone this GitHub repository (just the latest commit).
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - if: ${{ !inputs.skip-artifact-downloads }}
      name: Download the Python package dependency pins.
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        merge-multiple: true
    - name: Install Python ${{ inputs.python-version }}.
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Install Google Chrome.
      id: setup-chrome
      uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
      with:
        install-dependencies: true
        install-chromedriver: true
    - name: Force Selenium to use Chrome.
      shell: bash
      run: |
        echo "SE_BROWSER_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
    - name: Install build dependencies.
      shell: bash
      run: sudo make build-deps
    - name: Run the test suite.
      shell: bash
      run: make test
