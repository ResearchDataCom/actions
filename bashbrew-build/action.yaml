# NOTE: Keep documentation in sync with docs/bashbrew-build.md.
# Synchronize input descriptions with the corresponding `matrix.runs`
# property descriptions in the `strategy` output of the bashbrew-jobs
# action, as well.

name: Build and test a Docker container image.
description: >-
  Execute the strategy generated by [](bashbrew-jobs).  This action
  skips unspecified steps without raising an error.

  Uploading the built image to a container registry is the
  responsibility of the caller.

inputs:
  # The first six inputs are listed deliberately by order of
  # operation, not alphabetically.
  prepare:
    default: "true"
    description: >-
      This sets up the run-time environment.
  pull:
    default: "true"
    description: >-
      This specifies the build dependencies to download.
  build:
    default: "true"
    description: >-
      Build and tag the container image with these commands.
  history:
    default: "true"
    description: >-
      These commands pretty-print the container image's build history
      for later review.
  test:
    default: "true"
    description: >-
      This procedure tests the container image.
  images:
    default: "true"
    description: >-
      This lists the image tag(s) created by this job.
  # The remaining inputs are listed conventionally.
  access-app-id:
    description: >-
      Provide the app ID of a GitHub App used to access private
      repositories.  When
      [registering the app](https://docs.github.com/en/apps/creating-github-apps/registering-a-github-app/registering-a-github-app)
      in the organization, disable webhook functionality and grant
      **read-only**
      [repository permissions for "Contents"](https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps#repository-permissions-for-contents).
      After completing app registration,
      [generate a private key](https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/managing-private-keys-for-github-apps)
      and install the app, giving it access to selected repositories
      as appropriate.
  access-key:
    description: >-
      Log into the GitHub App used to access private repositories with
      this
      [private key](https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/managing-private-keys-for-github-apps).
  owner:
    description: >-
      Access private repositories owned by this GitHub account or
      organization, overriding
      [github.repository_owner](https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context).

runs:
  using: composite
  steps:
    - name: Clone this GitHub repository (just the latest commit).
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up private repository access (if configured).
      id: private-repository-access
      if: inputs.access-app-id && inputs.access-key
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.access-app-id }}
        private-key: ${{ inputs.access-key }}
        owner: ${{ inputs.owner || github.repository_owner }}
    - name: Prepare the test environment.
      shell: bash -Eeuo pipefail -x {0}
      run: ${{ inputs.prepare }}
    - name: Download build dependencies.
      shell: bash -Eeuo pipefail -x {0}
      run: ${{ inputs.pull }}
    - name: Build the container image.
      env:
        GH_TOKEN: ${{ steps.private-repository-access.outputs.token }}
      shell: bash -Eeuo pipefail -x {0}
      run: ${{ inputs.build }}
    - name: Review the build history.
      shell: bash -Eeuo pipefail -x {0}
      run: ${{ inputs.history }}
    - name: Test the built container image.
      shell: bash -Eeuo pipefail -x {0}
      run: ${{ inputs.test }}
    - name: Review the image tag(s).
      shell: bash -Eeuo pipefail -x {0}
      run: ${{ inputs.images }}
