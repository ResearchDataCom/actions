# NOTE: Keep documentation in sync with docs/bashbrew-jobs.md.

name: Generate Docker container image build jobs.
description: >-
  Output a GitHub Actions
  [matrix strategy](https://docs.github.com/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations)
  that builds and tests Docker Official Images Library-style container
  images.

runs:
  using: composite
  steps:
    - name: Link to sibling actions (cf. https://github.com/orgs/community/discussions/41927).
      shell: bash
      run: |
        SIBLINGS_PATH=$(realpath "${ACTION_PATH}/../")
        ROOT_DIR=$(realpath "${WORKSPACE_PATH}/..")
        SYMLINK_PATH="${ROOT_DIR}/action-siblings/ResearchDataCom/actions/bashbrew-jobs"
        mkdir -p "${ROOT_DIR}/action-siblings/ResearchDataCom/actions"
        ln -fs "${SIBLINGS_PATH}" "${SYMLINK_PATH}"
      env:
        ACTION_PATH: "${{ github.action_path }}"
        WORKSPACE_PATH: "${{ github.workspace }}"
    - name: Install Bashbrew et al.
      id: bashbrew
      uses: ./../action-siblings/ResearchDataCom/actions/bashbrew-strategy/setup-bashbrew
    - name: Clone this GitHub repository (just the latest commit).
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Generate Docker container image build jobs.
      id: generate-jobs
      shell: bash -Eeuo pipefail -x {0}
      env:
        BASHBREW_SCRIPTS: ${{ steps.bashbrew.outputs.scripts }}
      run: |
        image_name="${GITHUB_REPOSITORY#*/}"
        image_name="${image_name%-docker}"
        strategy="$(GITHUB_REPOSITORY="${image_name}" "$BASHBREW_SCRIPTS/github-actions/generate.sh")"
        strategy="$(
            sed -E 's!(docker buildx build)!\1 --secret id=GH_TOKEN!g' <<<"$strategy"
        )"
        EOF="EOF-$RANDOM-$RANDOM-$RANDOM"
        echo "strategy<<$EOF" >> "$GITHUB_OUTPUT"
        jq <<<"$strategy" . | tee -a "$GITHUB_OUTPUT"
        echo "$EOF" >> "$GITHUB_OUTPUT"

outputs:
  strategy:
    description: >-
      This action outputs a single-dimension matrix strategy in JSON
      format with the following properties:

      `matrix.name`
      : The container's version number, e.g., "2.3.1".

      `matrix.os`
      : The target GitHub Actions runner, e.g., "ubuntu-latest".

      `matrix.runs.prepare`
      : The run-time environment setup process.

      `matrix.runs.pull`
      : Build dependencies to be downloaded.

      `matrix.runs.build`
      : How to build and tag the container image.

      `matrix.runs.history`
      : These commands pretty print the container image's build
        history for later review.

      `matrix.runs.test`
      : The container image test procedure.

      `matrix.runs.images`
      : Lists the image tag(s) created by this job.
    value: ${{ steps.generate-jobs.outputs.strategy }}
